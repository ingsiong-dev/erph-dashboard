<style>
:root {
  --md-sys-color-primary: #1a73e8;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-background: #f8f9fa;
  --md-sys-color-surface: #ffffff;
  --md-sys-color-surface-variant: #f1f3f4;
  --md-sys-color-on-surface: #202124;
  --md-sys-color-on-surface-variant: #5f6368;
  --md-sys-color-outline: #dadce0;
  
  --color-success: #34a853;
  --color-warning: #f9ab00;
  --color-error: #ea4335;
  --color-purple: #a142f4;
  --color-blue-alt: #12b5cb;

  --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  --radius-md: 12px;
  --radius-lg: 16px;
  --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --md-sys-color-primary: #8ab4f8;
  --md-sys-color-on-primary: #202124;
  --md-sys-color-background: #151515;
  --md-sys-color-surface: #202124;
  --md-sys-color-surface-variant: #303134;
  --md-sys-color-on-surface: #e8eaed;
  --md-sys-color-on-surface-variant: #c4c7c5;
  --md-sys-color-outline: #3c4043;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Roboto', sans-serif;
}

body {
  background-color: var(--md-sys-color-background);
  color: var(--md-sys-color-on-surface);
  overflow-x: hidden;
  transition: var(--transition-smooth);
}

/* App Core Component Frames Structural Framework Layouts */
.app-layout {
  display: flex;
  min-height: 100vh;
  width: 100vw;
}

.sidebar-wrapper {
  width: 280px;
  background-color: var(--md-sys-color-surface);
  border-right: 1px solid var(--md-sys-color-outline);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  flex-shrink: 0;
  z-index: 100;
}

.main-viewport {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
  overflow-y: auto;
}

.top-navbar {
  height: 72px;
  background-color: var(--md-sys-color-surface);
  border-bottom: 1px solid var(--md-sys-color-outline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  flex-shrink: 0;
}

#content-area {
  padding: 32px;
  flex-grow: 1;
  position: relative;
}

/* Brand Logo Layout Typo */
.brand-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 40px;
  padding-left: 8px;
}
.brand-header .logo-icon {
  font-size: 36px;
  color: var(--md-sys-color-primary);
}
.brand-header h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.brand-header small {
  color: var(--md-sys-color-on-surface-variant);
  font-size: 12px;
}

/* Navigation Links Design Struct */
.sidebar-menu-links {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-grow: 1;
}
.menu-link {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  color: var(--md-sys-color-on-surface-variant);
  text-decoration: none;
  font-weight: 500;
  border-radius: var(--radius-md);

}
.menu-link:hover {

}
.menu-link.active {
  background-color: #e8f0fe;
  color: #1a73e8;
}
[data-theme="dark"] .menu-link.active {
  background-color: #384458;
  color: var(--md-sys-color-primary);
}

.sidebar-footer-info {
  border-top: 1px solid var(--md-sys-color-outline);
  padding-top: 16px;
}
.btn-refresh {
  width: 100%;
  padding: 12px;

  border: 1px solid var(--md-sys-color-outline);
  border-radius: var(--radius-md);
  color: var(--md-sys-color-on-surface);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 500;
  margin-bottom: 8px;
  transition: var(--transition-smooth);
}
.btn-refresh:hover {
  background-color: var(--md-sys-color-surface-variant);
}
#cache-timestamp-label {
  font-size: 11px;
  color: var(--md-sys-color-on-surface-variant);
  text-align: center;
}

/* Navbar Interface Elements */
.nav-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.nav-icon-btn {
  background: none;
  border: none;

  align-items: center;
  justify-content: center;

}
.nav-icon-btn:hover {

}
.notification-badge {

  height: 8px;
  background-color: var(--color-error);
  border-radius: 50%;
}
.vertical-divider {

}

/* Material Rounded SaaS Cards Framework Modules */

.kpi-card.small {

}
.kpi-card.small h4 {

}
.card-kpi-header {

}
.kpi-title {

}
.card-kpi-header .icon {
  padding: 8px;

}
.card-kpi-header .icon.blue { background-color: #e8f0fe; color: #1a73e8; }
.card-kpi-header .icon.green { background-color: #e6f4ea; color: #137333; }

/* SaaS Refactored Grid Table Implementations */

.table-responsive-wrapper {

.saas-data-table {

.saas-data-table th {
  background-color: var(--md-sys-color-surface-variant);

  font-size: 13px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface-variant);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.saas-data-table td {
  padding: 16px 24px;
  font-size: 14px;
  border-bottom: 1px solid var(--md-sys-color-outline);

}
.saas-data-table tbody tr:last-child td {
  border-bottom: none;
}
.saas-data-table tbody tr:hover td {
  background-color: var(--md-sys-color-background);
  cursor: pointer;
}

/* Directory Utility Operational Layout elements */
.filter-action-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.search-input-group {
  display: flex;
  align-items: center;
  gap: 12px;
  background-color: var(--md-sys-color-surface);

.select-dropdown-group select {

}

/* Execution Element Status Badges elements UI Elements Component definitions */
.status-pill {

  align-items: center;
  padding: 6px 12px;

  font-size: 12px;

/* Engine UI Progress Bar Objects Components */
.table-progressbar-container {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 160px;
}
.bar-track-outer {
  flex-grow: 1;
  height: 8px;
  background-color: var(--md-sys-color-surface-variant);
  border-radius: 4px;

}

.pct-txt {
  font-size: 12px;

  width: 32px;

}

/* Master Pagination Footer Elements */
.pagination-footer-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  border-top: 1px solid var(--md-sys-color-outline);
  background-color: var(--md-sys-color-surface);
}
#pagination-status-descriptor-label {
  font-size: 13px;
  color: var(--md-sys-color-on-surface-variant);
}
.pagination-buttons-nav {
  display: flex;
  gap: 8px;
}
.btn-pagination-control {
  background: none;
  border: 1px solid var(--md-sys-color-outline);
  padding: 6px;
  border-radius: 50%;
  cursor: pointer;
  color: var(--md-sys-color-on-surface);
  display: flex;
  align-items: center;
}
.btn-pagination-control:hover {
  background-color: var(--md-sys-color-surface-variant);
}

/* Teacher Detail Module Screen Structures */
.back-navigation-action-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  color: var(--md-sys-color-primary);
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 24px;
  font-size: 14px;
}
.profile-header-card-layout {
  background-color: var(--md-sys-color-surface);
  border-radius: var(--radius-lg);
  padding: 32px;
  border: 1px solid var(--md-sys-color-outline);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.profile-identity-card-avatar {

  color: var(--md-sys-color-primary);

  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 700;
}
.profile-identity-text-details {
  flex-grow: 1;
}
.profile-identity-text-details h2 {
  font-size: 22px;
  margin-bottom: 4px;
}
.profile-identity-text-details p {
  color: var(--md-sys-color-on-surface-variant);
  font-size: 14px;

}
.meta-tag-pills-row {
  display: flex;

}
.subject-pill-tag {
  background-color: var(--md-sys-color-surface-variant);
  padding: 4px 10px;

}
.profile-computational-score-metrics {

}
.score-card-block {

  padding: 16px;

}
.score-card-block .num { font-size: 22px; font-weight: 700; display: block; }
.score-card-block .lbl { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }

/* Timeline Visual Activity Tracking Blocks Nodes Matrix Layout */
.timeline-visualization-card-container {
  background-color: var(--md-sys-color-surface);
  border-radius: var(--radius-lg);
  padding: 24px;
  border: 1px solid var(--md-sys-color-outline);
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}
.timeline-visualization-card-container h3 {
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 16px;
}
.matrix-grid-timeline-cells-wrapper {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 12px;
}
.timeline-cell-node {
  border: 1px solid var(--md-sys-color-outline);
  border-radius: var(--radius-md);
  padding: 10px;

  font-size: 12px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.timeline-cell-node.submitted { background-color: #e6f4ea; border-color: #clebd2; color: #137333; }
.timeline-cell-node.missing { background-color: #fce8e6; border-color: #fad2cf; color: #c5221f; }
.timeline-cell-node.future { background-color: #f1f3f4; border-color: #dadce0; color: #5f6368; }

  box-shadow: var(--shadow-md);

}
.dropdown-overlay h4 { font-size: 14px; margin-bottom: 8px; }
.alert-row-item {

  border-bottom: 1px solid var(--md-sys-color-outline);
  font-size: 12px;
}
.alert-row-item:last-child { border-bottom: none; }

/* Advanced Matrix Heatmap Components CSS styles definitions formatting layout layer */
.analytical-matrix-table th { background-color: #3c4043; color: white; }
.heatmap-cell-density { font-weight: 500; }

/* Interactive Modern Reports Download Center Panel Components */
.reporting-options-grid-layout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
}
.report-action-selection-card {

  border-radius: var(--radius-lg);
  padding: 32px;

  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.card-icon-illustration-badge {

  align-items: center;

}

.card-icon-illustration-badge.blue { background-color: #e8f0fe; color: #1a73e8; }

.btn-report-download {

/* System Dynamic Structural View Framework Utilities Classes */

.center-text { text-align: center !important; }

/* Loading State Components Layout Animation CSS */

  flex-direction: column;
  align-items: center;

}

  border-top: 4px solid var(--md-sys-color-primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.auth-denied-container {

}
