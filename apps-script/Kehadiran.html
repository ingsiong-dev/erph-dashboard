<div class="dashboard-content-grid">

  <div class="kpi-cards-grid">
    <div class="kpi-card">
      <div class="card-kpi-header">
        <span class="kpi-title">Purata Tahunan</span>
        <span class="material-symbols-outlined icon blue">analytics</span>
      </div>
      <h3 id="kh-yearly" class="kpi-value">-</h3>
    </div>
    <div class="kpi-card">
      <div class="card-kpi-header">
        <span class="kpi-title">Bulan Terkini</span>
        <span class="material-symbols-outlined icon green">event_available</span>
      </div>
      <h3 id="kh-latest" class="kpi-value">-</h3>
    </div>
    <div class="kpi-card">
      <div class="card-kpi-header">
        <span class="kpi-title">Perubahan Bulanan</span>
        <span class="material-symbols-outlined icon purple">trending_up</span>
      </div>
      <h3 id="kh-beza" class="kpi-value">-</h3>
    </div>
    <div class="kpi-card">
      <div class="card-kpi-header">
        <span class="kpi-title">Bulan Dilaporkan</span>
        <span class="material-symbols-outlined icon orange">calendar_month</span>
      </div>
      <h3 id="kh-reported" class="kpi-value">-</h3>
    </div>
  </div>

  <div class="dashboard-charts-row">
    <div class="chart-card-wrapper flex-3">
      <h3>Peratus Kehadiran Bulanan <span id="kh-year-chart"></span></h3>
      <div class="chart-canvas-container">
        <canvas id="chartKehadiranBulanan"></canvas>
      </div>
    </div>
  </div>

  <div class="dashboard-charts-row">

    <div class="chart-card-wrapper flex-1">
      <h3>Purata Mengikut Tingkatan</h3>
      <div class="table-responsive-wrapper" style="padding:0 20px 20px 20px;">
        <table class="saas-data-table">
          <thead>
            <tr><th>Tingkatan</th><th>Peratus</th></tr>
          </thead>
          <tbody id="kh-form-rows">
            <tr><td colspan="2" class="center-text">Memuatkan...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="chart-card-wrapper flex-2">
      <h3>Purata Mengikut Kelas</h3>
      <div class="table-responsive-wrapper" style="padding:0 20px 20px 20px; max-height:420px; overflow-y:auto;">
        <table class="saas-data-table">
          <thead>
            <tr><th>Kelas</th><th>Peratus</th><th style="width:35%;"></th></tr>
          </thead>
          <tbody id="kh-class-rows">
            <tr><td colspan="3" class="center-text">Memuatkan...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <p id="kh-status" class="empty-state-text" style="text-align:left;"></p>

</div>

<script>
  var KH_DATA = null;
  var KH_LOADING = false;
  var khChart = null;

  function khPct(v) {
    if (v === null || v === undefined || v === '') return '-';
    return Number(v).toFixed(2) + '%';
  }

  // factual direction, not an invented threshold: green = up, red = down
  function khBeza(v) {
    if (v === null || v === undefined || v === '') return '-';
    var n = Number(v);
    return (n > 0 ? '+' : '') + n.toFixed(2) + ' pp';
  }

  function khSetStatus(msg, isError) {
    var el = document.getElementById('kh-status');
    if (!el) return;
    el.textContent = msg || '';
    el.className = 'empty-state-text' + (isError ? ' text-error' : '');
    el.style.textAlign = 'left';
  }

  function initKehadiranModule() {
    if (KH_DATA || KH_LOADING) return;   // loaded once per session
    KH_LOADING = true;
    khSetStatus('Memuatkan data kehadiran...');

    google.script.run
      .withSuccessHandler(function (data) {
        KH_LOADING = false;
        KH_DATA = data;
        renderKehadiranModule();
      })
      .withFailureHandler(function (err) {
        KH_LOADING = false;
        khSetStatus('Gagal memuatkan data kehadiran: ' +
          ((err && err.message) ? err.message : err), true);
      })
      .getKehadiranAnalysis();
  }

  function renderKehadiranModule() {
    var d = KH_DATA || {};

    // ---- KPI ----
    var yearly = document.getElementById('kh-yearly');
    if (yearly) yearly.textContent = khPct(d.yearlyAverage);

    var latest = document.getElementById('kh-latest');
    if (latest) {
      latest.textContent = d.latest ? (d.latest.code + '  ' + khPct(d.latest.pct)) : '-';
      latest.style.fontSize = '20px';
    }

    var bezaEl = document.getElementById('kh-beza');
    if (bezaEl) {
      bezaEl.textContent = d.latest ? khBeza(d.latest.beza) : '-';
      bezaEl.className = 'kpi-value' + (d.latest && d.latest.beza > 0 ? ' text-success'
                                       : (d.latest && d.latest.beza < 0 ? ' text-error' : ''));
      bezaEl.style.fontSize = '20px';
    }

    var reported = document.getElementById('kh-reported');
    if (reported) reported.textContent = (d.monthsReported || 0) + ' / ' + (d.monthsTotal || 0);

    var yc = document.getElementById('kh-year-chart');
    if (yc) yc.textContent = d.year || '';

    // ---- per form ----
    var formBody = document.getElementById('kh-form-rows');
    if (formBody) {
      var formRows = (d.forms || []).map(function (f) {
        return '<tr><td>' + f.form + '</td><td>' + khPct(f.pct) + '</td></tr>';
      }).join('');
      formBody.innerHTML = formRows || '<tr><td colspan="2" class="center-text">Tiada data.</td></tr>';
    }

    // ---- per class (bar makes weak classes visible at a glance) ----
    var classBody = document.getElementById('kh-class-rows');
    if (classBody) {
      var classRows = (d.classes || []).map(function (c) {
        var w = Math.max(0, Math.min(100, Number(c.pct) || 0));
        return '<tr><td>' + c.kelas + '</td><td>' + khPct(c.pct) + '</td>' +
          '<td><div style="background:#e8eaed;border-radius:6px;height:8px;width:100%;overflow:hidden;">' +
          '<div style="background:#1a73e8;height:100%;width:' + w + '%;"></div></div></td></tr>';
      }).join('');
      classBody.innerHTML = classRows || '<tr><td colspan="3" class="center-text">Tiada data.</td></tr>';
    }

    drawKehadiranChart(d.monthly || []);

    khSetStatus('Sumber: Graf kehadiran ' + (d.year || '') + '  |  Dikemas kini: ' + (d.generated || '-'));
  }

  function drawKehadiranChart(monthly) {
    var canvas = document.getElementById('chartKehadiranBulanan');
    if (!canvas || typeof Chart === 'undefined' || khChart) return;

    // let the view finish laying out before Chart.js measures the canvas
    setTimeout(function () {
      khChart = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: monthly.map(function (m) { return m.code; }),
          datasets: [{
            label: 'Peratus Kehadiran',
            data: monthly.map(function (m) { return m.pct; }),   // null months render as gaps
            backgroundColor: '#1a73e8',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: {
              suggestedMin: 85,
              suggestedMax: 100,
              ticks: { callback: function (v) { return v + '%'; } }
            }
          }
        }
      });
    }, 80);
  }
</script>
